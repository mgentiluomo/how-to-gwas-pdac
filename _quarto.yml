project:
  type: website
  output-dir: _site

website:
  title: "How to carry out a GWAS"
  description: >-
    A decision-focused, reproducible guide to genome-wide association studies of
    rare and complex traits, using pancreatic cancer as a worked example.
    TRANSPAN COST Action (CA21116), WG1.
  repo-url: https://github.com/mgentiluomo/how-to-gwas-pdac
  repo-actions: [edit, issue]
  page-navigation: true
  back-to-top-navigation: true
  sidebar:
    style: docked
    search: true
    collapse-level: 1
    contents:
      - text: "Home"
        href: index.qmd
      - section: "Before you start"
        contents:
          - getting_started.qmd
      - section: "Quality control"
        contents:
          - sections/01B_genotyping_qc/01B_genotyping_qc.qmd
      - section: "Ancestry and structure"
        contents:
          - sections/02_population_stratification/02_population_stratification.qmd
      - section: "Association testing"
        contents:
          - sections/04A_association_binary/04A_association_binary.qmd
      # Manuscript sections will be added here as they are drafted:
      # - section: "Pre-GWAS"
      #   contents:
      #     - 1B_qc.qmd
      #     - 2_population_stratification.qmd
      #     - 3_imputation.qmd
      # - section: "GWAS"
      #     ...

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    code-block-bg: true
    code-block-border-left: "#4051b5"
    css: styles.css
    highlight-style: github

# Heavy steps (PLINK on the server) are shown but not re-run on each render.
# Light R chunks are executed once and then frozen, so the site rebuilds fast.
execute:
  freeze: auto
  warning: false
  message: false
